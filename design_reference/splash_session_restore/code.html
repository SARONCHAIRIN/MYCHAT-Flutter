ndary": "#ffffff", "tertiary-fixed-dim": "#4edea3" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-sm": "0.5rem", "space-md": "0.75rem", "space-xl": "1.5rem", "gutter": "1rem", "space-xs": "0.25rem", "space-lg": "1rem" }, fontFamily: { "body-lg": ["Inter"], "micro-badge": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "headline-md": ["Inter"], "title-lg": ["Inter"], "headline-lg": ["Inter"], "caption-sm": ["Inter"], "title-md": ["Inter"] }, fontSize: { "body-lg": ["16px", { lineHeight: "22px", fontWeight: "400" }], "micro-badge": ["10px", { lineHeight: "12px", fontWeight: "600" }], "label-md": ["13px", { lineHeight: "16px", fontWeight: "500" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "headline-md": ["24px", { lineHeight: "30px", letterSpacing: "-0.015em", fontWeight: "600" }], "title-lg": ["22px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }], "headline-lg": ["28px", { lineHeight: "34px", letterSpacing: "-0.02em", fontWeight: "700" }], "caption-sm": ["12px", { lineHeight: "15px", fontWeight: "400" }], "title-md": ["18px", { lineHeight: "24px", letterSpacing: "-0.005em", fontWeight: "600" }] } } } }</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full relative overflow-hidden py-10 px-margin items-center justify-between min-h-[640px]">
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-80 h-80 bg-secondary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="w-full flex items-center justify-between text-on-surface-variant z-10 pt-2">
<div class="flex items-center space-x-1 text-tertiary">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-micro-badge text-micro-badge uppercase tracking-wider font-semibold">End-to-End Encrypted</span>
</div>
<div class="flex items-center space-x-1 bg-surface-container px-2.5 py-1 rounded-full text-on-surface-variant shadow-sm">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
<span class="font-caption-sm text-caption-sm font-medium">Cloud Sync</span>
</div>
</div>
<div class="flex flex-col items-center justify-center text-center my-auto z-10 px-4">
<div class="relative mb-6 flex items-center justify-center">
<div class="absolute inset-0 bg-primary/20 rounded-2xl blur-xl scale-125 animate-pulse"></div>
<div class="relative w-28 h-28 rounded-2xl bg-surface-container-lowest shadow-xl flex items-center justify-center p-4">
<img alt="MYCHAT Logo" class="w-20 h-20 object-contain drop-shadow-md select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida/AEtjO1WvQG41WGy8xe_T9GG3eVcGl5jT7_1xSwcB2kgUP6alMqv04WRFJoCzrJWbrmyffsuprjc19Ap7KpjerqwsTgZgX-bJbld-ZqsM8NjeZn9qOE9mx0a1cgfbGxj0-fImPBhr5qWueGmVDcwlLTGym1UKQ6N4T7EYlThjUKGTTDuUbd50lVH_XepcgoJm8dBMzV1Tbv9Lkwr5DjokrZCZrNBkoYlX-HgkZVcPOFVmyhVX"/>
</div>
<div class="absolute -bottom-2 -right-2 bg-primary-container text-on-primary rounded-full p-1.5 shadow-md flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]">bolt</span>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-bold mb-1">
      MYCHAT
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs font-medium">
      Fast. Secure. Real-time messaging.
    </p>
<div class="mt-8 flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary">verified_user</span>
<span class="font-caption-sm text-caption-sm">Verified Secure Channel</span>
</div>
</div>
<div class="w-full flex flex-col items-center space-y-4 z-10 pb-4">
<div class="flex flex-col items-center space-y-3">
<div class="relative w-10 h-10 flex items-center justify-center">
<svg class="animate-spin w-8 h-8 text-surface-container-highest" fill="none" viewbox="0 0 24 24">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="text-primary opacity-90" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
<div class="flex flex-col items-center text-center">
<p class="font-label-md text-label-md text-on-surface font-semibold tracking-wide transition-all duration-300" id="auth-status-text">
          Connecting to MYCHAT...
        </p>
<p class="font-caption-sm text-caption-sm text-on-surface-variant transition-all duration-300" id="auth-substatus-text">
          Restoring secure session token
        </p>
</div>
</div>
<div class="flex flex-col items-center pt-2">
<div class="flex items-center space-x-2">
<span class="w-1.5 h-1.5 rounded-full bg-primary/60"></span>
<span class="font-caption-sm text-caption-sm text-outline font-medium tracking-tight">
          v1.0.0 (Spring Boot &amp; Flutter API)
        </span>
</div>
<div class="flex items-center space-x-4 mt-2 text-outline">
<span class="font-micro-badge text-micro-badge tracking-wider uppercase font-semibold">TLS 1.3</span>
<span class="font-micro-badge text-micro-badge tracking-wider uppercase font-semibold">•</span>
<span class="font-micro-badge text-micro-badge tracking-wider uppercase font-semibold">WebSockets Ready</span>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const statusEl = document.getElementById('auth-status-text');
    const subStatusEl = document.getElementById('auth-substatus-text');

    const steps = [
      { main: "Connecting to MYCHAT...", sub: "Restoring secure session token" },
      { main: "Validating identity...", sub: "Syncing conversational keys" },
      { main: "Almost ready...", sub: "Loading recent messages" }
    ];

    let currentStep = 0;
    setInterval(() => {
      currentStep = (currentStep + 1) % steps.length;
      if (statusEl && subStatusEl) {
        statusEl.style.opacity = '0';
        subStatusEl.style.opacity = '0';
        setTimeout(() => {
          statusEl.textContent = steps[currentStep].main;
          subStatusEl.textContent = steps[currentStep].sub;
          statusEl.style.opacity = '1';
          subStatusEl.style.opacity = '1';
        }, 200);
      }
    }, 2400);
  })();
</script></main></body></html>
